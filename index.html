<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw3H8TvVhJoENmSts6Msrenivow2rZifFrYlOVcgtE7-SJ8cLEdx9sBGQQHY5YT8AKo/exec";

let tasks = [];
let comments = [];
let projects = [];
let team = [];

let currentTaskId = null;

const statuses = {
    todo:"Треба зробити",
    progress:"В роботі",
    review:"На погодженні",
    revision:"Потрібні правки",
    done:"Готово"
};

async function loadData(){

    const res = await fetch(
        API_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    tasks = data.tasks || [];
    comments = data.comments || [];
    projects = data.projects || [];
    team = data.team || [];

    render();
    renderSelects();

}

function renderSelects(){

    direction.innerHTML =
        `<option value="">Напрямок</option>`;

    assignee.innerHTML =
        `<option value="">Виконавець</option>`;

    projects.forEach(project=>{

        direction.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

    });

    team.forEach(person=>{

        assignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

    });

}

function render(){

    clearColumns();

    tasks.forEach(task=>{

        const div =
            createTaskCard(task);

        switch(task["статус"]){

            case "В роботі":
                progress.appendChild(div);
                break;

            case "На погодженні":
                review.appendChild(div);
                break;

            case "Потрібні правки":
                revision.appendChild(div);
                break;

            case "Готово":
                done.appendChild(div);
                break;

            default:
                todo.appendChild(div);

        }

    });

}

function createTaskCard(task){

    const div =
        document.createElement("div");

    div.className =
        `task ${
            task["пріоритет"] === "Високий"
            ? "high"
            : ""
        }`;

    div.dataset.id = task.id;

    div.onclick = ()=>openTask(task.id);

    div.innerHTML = `

        <div class="task-title">
            ${task["назва"]}
        </div>

        <div class="task-direction">
            📁 ${task["напрямок"] || "—"}
        </div>

        <div class="task-meta">

            <div>
                👤 ${task["виконавець"] || "—"}
            </div>

            <div>
                ⏰ ${task["дедлайн"] || "—"}
            </div>

        </div>

    `;

    return div;

}

function openTask(id){

    currentTaskId = id;

    const task =
        tasks.find(t=>t.id == id);

    if(!task) return;

    editTitle.value =
        task["назва"] || "";

    editDescription.value =
        task["опис"] || "";

    editPriority.value =
        task["пріоритет"] || "Середній";

    editDeadline.value =
        task["дедлайн"] || "";

    renderEditSelects(task);
    renderComments();

    taskModal.classList.add("show");

}

function renderEditSelects(task){

    editDirection.innerHTML = "";
    editAssignee.innerHTML = "";

    projects.forEach(project=>{

        editDirection.innerHTML += `
            <option
                value="${project.name}"
                ${
                    task["напрямок"] === project.name
                    ? "selected"
                    : ""
                }
            >
                ${project.name}
            </option>
        `;

    });

    team.forEach(person=>{

        editAssignee.innerHTML += `
            <option
                value="${person.name}"
                ${
                    task["виконавець"] === person.name
                    ? "selected"
                    : ""
                }
            >
                ${person.name}
            </option>
        `;

    });

}

async function saveTask(){

    const task =
        tasks.find(t=>t.id == currentTaskId);

    if(!task) return;

    task["назва"] =
        editTitle.value;

    task["опис"] =
        editDescription.value;

    task["пріоритет"] =
        editPriority.value;

    task["виконавець"] =
        editAssignee.value;

    task["дедлайн"] =
        editDeadline.value;

    task["напрямок"] =
        editDirection.value;

    render();

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"updateTask",

            id:currentTaskId,

            "назва":
                editTitle.value,

            "опис":
                editDescription.value,

            "пріоритет":
                editPriority.value,

            "виконавець":
                editAssignee.value,

            "дедлайн":
                editDeadline.value,

            "напрямок":
                editDirection.value

        })
    });

}

function renderComments(){

    commentsList.innerHTML = "";

    const taskComments =
        comments.filter(
            c=>c.taskId == currentTaskId
        );

    taskComments.forEach(comment=>{

        commentsList.innerHTML += `

            <div class="comment">

                <div class="comment-author">
                    ${comment.author}
                </div>

                <div>
                    ${comment.text}
                </div>

            </div>

        `;

    });

}

async function addComment(){

    const author =
        commentAuthor.value;

    const text =
        commentText.value;

    if(!author || !text){
        return;
    }

    const localComment = {
        taskId:currentTaskId,
        author:author,
        text:text
    };

    comments.push(localComment);

    renderComments();

    commentText.value = "";

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"addComment",

            taskId:currentTaskId,

            author:author,

            text:text

        })
    });

}

function closeModal(){

    taskModal.classList.remove("show");

}

function clearColumns(){

    todo.innerHTML = "";
    progress.innerHTML = "";
    review.innerHTML = "";
    revision.innerHTML = "";
    done.innerHTML = "";

}

async function updateStatus(id,newStatus){

    const task =
        tasks.find(t=>t.id == id);

    if(task){

        task["статус"] =
            newStatus;

        render();

    }

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"updateTaskStatus",

            id:id,

            newStatus:newStatus

        })
    });

}

document
.getElementById("taskForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const newTask = {

        id:Date.now().toString(),

        "назва":
            title.value,

        "опис":
            description.value,

        "статус":
            "Треба зробити",

        "пріоритет":
            priority.value,

        "виконавець":
            assignee.value,

        "дедлайн":
            deadline.value,

        "напрямок":
            direction.value

    };

    tasks.unshift(newTask);

    render();

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"createTask",

            "назва":
                title.value,

            "опис":
                description.value,

            "напрямок":
                direction.value,

            "виконавець":
                assignee.value,

            "пріоритет":
                priority.value,

            "дедлайн":
                deadline.value

        })
    });

    e.target.reset();

});

[
    "todo",
    "progress",
    "review",
    "revision",
    "done"
].forEach(id=>{

    new Sortable(
        document.getElementById(id),
        {

            group:"tasks",

            animation:150,

            onEnd: async(evt)=>{

                const taskId =
                    evt.item.dataset.id;

                const newStatus =
                    statuses[evt.to.id];

                await updateStatus(
                    taskId,
                    newStatus
                );

            }

        }
    );

});

loadData();

</script>
