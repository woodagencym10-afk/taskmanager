<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoforma Marketing Tasks</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="login-box">
            <h2>Вхід у систему</h2>
            <input type="text" id="login-username" placeholder="Твоє ім'я (як у таблиці)">
            <input type="password" id="login-password" placeholder="Пароль">
            <button onclick="loginUser()">Увійти</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <div id="app-screen" class="screen" style="display: none;">
        <header>
            <div class="user-info">
                Привіт, <span id="current-user-name"></span>! 
                <span class="role-badge" id="current-user-role"></span>
            </div>
            <div class="header-actions">
                <button class="btn-primary" onclick="openModal('task-modal')">+ Нова задача</button>
                <button class="btn-secondary" onclick="openModal('plan-modal')">🌅 План на день</button>
                <button class="btn-outline" onclick="logoutUser()">Вийти</button>
            </div>
        </header>

        <div class="board">
            <div class="column">
                <h3>В черзі <span class="task-count" id="count-queue">0</span></h3>
                <div class="task-list" id="list-queue" data-status="В черзі"></div>
            </div>
            <div class="column">
                <h3>В роботі <span class="task-count" id="count-progress">0</span></h3>
                <div class="task-list" id="list-progress" data-status="В роботі"></div>
            </div>
            <div class="column">
                <h3>Готово <span class="task-count" id="count-done">0</span></h3>
                <div class="task-list" id="list-done" data-status="Готово"></div>
            </div>
        </div>
    </div>

    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('task-modal')">&times;</span>
            <h2>Додати задачу</h2>
            <input type="text" id="task-title" placeholder="Назва задачі" required>
            <textarea id="task-desc" placeholder="Опис та ТЗ..." rows="3"></textarea>
            <input type="text" id="task-project" placeholder="Напрямок проєкту (напр. SMM, Сайт)">
            <input type="text" id="task-assignee" placeholder="Відповідальна">
            <input type="date" id="task-deadline" required>
            <button class="btn-primary" onclick="createTask()" id="btn-save-task">Зберегти</button>
        </div>
    </div>

    <div id="plan-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('plan-modal')">&times;</span>
            <h2>Мій план на сьогодні</h2>
            <textarea id="plan-details" placeholder="Опиши, що плануєш зробити..." rows="4"></textarea>
            <button class="btn-primary" onclick="sendMorningPlan()" id="btn-send-plan">Відправити в Telegram</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
