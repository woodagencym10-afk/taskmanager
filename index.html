<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing OS</title>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

body{
    margin:0;
    background:#0f1117;
    color:white;
    font-family:Arial;
}

.top{
    padding:20px;
    border-bottom:1px solid #222;
}

.board{
    display:flex;
    gap:20px;
    padding:20px;
    overflow:auto;
}

.column{
    min-width:320px;
    background:#171d29;
    border-radius:20px;
    padding:15px;
}

.column h2{
    margin-top:0;
}

.task-list{
    min-height:100px;
}

.task{
    background:#222b3d;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
}

.task.high{
    border-left:5px solid red;
}

input,
textarea,
select{
    width:100%;
    margin-bottom:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#222b3d;
    color:white;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4f8cff;
    color:white;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="top">

<h1>🚀 Marketing OS</h1>

<form id="taskForm">

<input
    type="text"
    id="title"
    placeholder="Назва задачі"
    required
/>

<textarea
    id="description"
    placeholder="Опис"
></textarea>

<select id="direction"></select>

<select id="assignee"></select>

<select id="priority">
    <option value="Середній">Середній</option>
    <option value="Високий">Високий</option>
</select>

<input type="date" id="deadline"/>

<button type="submit">
    Створити задачу
</button>

</form>

</div>

<div class="board">

<div class="column">
<h2>📝 Треба зробити</h2>
<div class="task-list" id="todo"></div>
</div>

<div class="column">
<h2>⚙️ В роботі</h2>
<div class="task-list" id="progress"></div>
</div>

<div class="column">
<h2>👀 На погодженні</h2>
<div class="task-list" id="review"></div>
</div>

<div class="column">
<h2>🔁 Потрібні правки</h2>
<div class="task-list" id="revision"></div>
</div>

<div class="column">
<h2>✅ Готово</h2>
<div class="task-list" id="done"></div>
</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw3H8TvVhJoENmSts6Msrenivow2rZifFrYlOVcgtE7-SJ8cLEdx9sBGQQHY5YT8AKo/exec";

let tasks = [];

const statuses = {
    todo:"Треба зробити",
    progress:"В роботі",
    review:"На погодженні",
    revision:"Потрібні правки",
    done:"Готово"
};

async function loadData(){

    const res = await fetch(
        API_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    tasks = data.tasks || [];

    render();

    renderSelects(data);

}

function renderSelects(data){

    const direction =
        document.getElementById("direction");

    const assignee =
        document.getElementById("assignee");

    direction.innerHTML =
        `<option value="">Напрямок</option>`;

    assignee.innerHTML =
        `<option value="">Виконавець</option>`;

    data.projects.forEach(project=>{

        direction.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

    });

    data.team.forEach(person=>{

        assignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

    });

}

function render(){

    clearColumns();

    tasks.forEach(task=>{

        const div =
            document.createElement("div");

        div.className =
            `task ${
                task["пріоритет"] === "Високий"
                ? "high"
                : ""
            }`;

        div.dataset.id = task.id;

        div.innerHTML = `
            <h3>${task["назва"]}</h3>

            <div>
                📁 ${task["напрямок"] || "—"}
            </div>

            <div>
                👤 ${task["виконавець"] || "—"}
            </div>

            <div>
                ⏰ ${task["дедлайн"] || "—"}
            </div>
        `;

        switch(task["статус"]){

            case "В роботі":
                progress.appendChild(div);
                break;

            case "На погодженні":
                review.appendChild(div);
                break;

            case "Потрібні правки":
                revision.appendChild(div);
                break;

            case "Готово":
                done.appendChild(div);
                break;

            default:
                todo.appendChild(div);

        }

    });

}

function clearColumns(){

    [
        "todo",
        "progress",
        "review",
        "revision",
        "done"
    ].forEach(id=>{

        document
            .getElementById(id)
            .innerHTML = "";

    });

}

async function updateStatus(id,newStatus){

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"updateTaskStatus",
            id:id,
            newStatus:newStatus
        })
    });

    loadData();

}

document
.getElementById("taskForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"createTask",

            "назва":
                document
                .getElementById("title")
                .value,

            "опис":
                document
                .getElementById("description")
                .value,

            "напрямок":
                document
                .getElementById("direction")
                .value,

            "виконавець":
                document
                .getElementById("assignee")
                .value,

            "пріоритет":
                document
                .getElementById("priority")
                .value,

            "дедлайн":
                document
                .getElementById("deadline")
                .value

        })
    });

    e.target.reset();

    loadData();

});

[
    "todo",
    "progress",
    "review",
    "revision",
    "done"
].forEach(id=>{

    new Sortable(
        document.getElementById(id),
        {

            group:"tasks",

            animation:150,

            onEnd: async(evt)=>{

                const taskId =
                    evt.item.dataset.id;

                const newStatus =
                    statuses[evt.to.id];

                await updateStatus(
                    taskId,
                    newStatus
                );

            }

        }
    );

});

loadData();

</script>

</body>
</html>
