<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ecoforma Manager</title>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-6xl mx-auto p-6">
        <div id="projectTabs" class="flex gap-2 mb-8 bg-white p-2 rounded-xl shadow-sm border">
            </div>

        <div id="board" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        // ДАНІ (Тут буде fetch з твого GAS)
        const tasks = [
            { id: 1, project: 'Ecoforma', task: 'Звіт по рекламі', status: 'In Progress', deadline: '2026-05-25', assignee: 'Vitaliy', telegram: 'vitaliy_user' },
            { id: 2, project: 'Wood Agency', task: 'Сайт', status: 'Todo', deadline: '2026-06-01', assignee: 'Nazar', telegram: 'nazar_dev' }
        ];

        let activeProject = 'Ecoforma';

        function render() {
            const tabsContainer = document.getElementById('projectTabs');
            const board = document.getElementById('board');
            const projects = [...new Set(tasks.map(t => t.project))];
            
            // Рендер табів
            tabsContainer.innerHTML = projects.map(p => `
                <button onclick="activeProject='${p}'; render()" 
                    class="px-4 py-2 rounded-lg ${activeProject === p ? 'bg-indigo-600 text-white' : 'bg-gray-100'}">
                    ${p}
                </button>
            `).join('');

            // Рендер дошки
            const statuses = ['Todo', 'In Progress', 'Done'];
            board.innerHTML = statuses.map(s => `
                <div>
                    <h2 class="font-bold text-gray-500 mb-4 uppercase text-xs">${s}</h2>
                    ${tasks.filter(t => t.project === activeProject && t.status === s).map(t => `
                        <div class="bg-white p-4 rounded-lg shadow-sm border mb-3">
                            <h3 class="font-semibold">${t.task}</h3>
                            <p class="text-sm text-gray-500">⏳ ${t.deadline}</p>
                            <div class="flex justify-between items-center mt-3">
                                <span class="text-xs bg-gray-100 px-2 py-1 rounded">${t.assignee}</span>
                                <a href="https://t.me/${t.telegram}" target="_blank" class="text-indigo-600 text-xs font-bold underline">Telegram</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
