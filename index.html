<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетинг Таск-Менеджер</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root { --bg-color: #f4f5f7; --col-bg: #ebecf0; --card-bg: #ffffff; --primary: #0052cc; --text: #172b4d; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        #login-screen { max-width: 300px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        #login-screen input, #login-screen select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0043a6; }
        
        #board-screen { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        
        .filters-bar { display: none; background: #dfe1e6; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; align-items: center; gap: 15px; flex-wrap: wrap; }
        .filters-bar select, .filters-bar input[type="date"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; }
        
        .board { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .column { background-color: var(--col-bg); border-radius: 8px; width: 280px; min-width: 280px; display: flex; flex-direction: column; max-height: 80vh; }
        .column-header { padding: 10px 15px; font-weight: bold; border-bottom: 2px solid #dfe1e6; }
        .task-list { padding: 10px; flex-grow: 1; overflow-y: auto; min-height: 50px; }
        .task-card { background-color: var(--card-bg); padding: 10px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 10px; cursor: pointer; border-left: 4px solid var(--primary); }
        .task-card:hover { background-color: #f9fafc; }
        .task-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .task-meta { font-size: 12px; color: #5e6c84; display: flex; justify-content: space-between;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 8px; width: 450px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .close-btn { float: right; cursor: pointer; font-size: 20px; font-weight: bold; }
        
        .comment-box { background: #f4f5f7; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 13px;}
        .comment-author { font-weight: bold; color: var(--primary); }
        .comment-date { font-size: 10px; color: #777; margin-left: 5px; }

        .btn-success { background-color: #36b37e; margin-top: 15px; width: 100%;}
        .btn-success:hover { background-color: #2b9065; }
        .btn-logout { background-color: #ff5630; }
        .inline-edit-date { padding: 2px 5px !important; margin: 0 !important; width: auto !important; display: inline-block; font-size: 13px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Вхід в систему</h2>
        <input type="text" id="login-username" placeholder="Ваше ім'я">
        <input type="password" id="login-password" placeholder="Пароль">
        <button style="width: 100%;" onclick="appLogin()">Увійти</button>
        <p id="login-error" style="color: red; font-size: 12px; display: none;"></p>
    </div>

    <div id="board-screen">
        <div class="header">
            <div>
                <h2 style="margin: 0 0 5px 0;">Маркетинг / Задачі</h2>
                <span id="user-info" style="color: #5e6c84; font-size: 14px;"></span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="openCreateModal()">+ Нова картка</button>
                <button class="btn-logout" onclick="logout()">Вийти</button>
            </div>
        </div>

        <div id="filters-container" class="filters-bar">
            <span>📅 <b>Показати виконане за:</b></span>
            <input type="date" id="date-start" onchange="loadTasks()">
            <span>до</span>
            <input type="date" id="date-end" onchange="loadTasks()">
            
            <div style="border-left: 1px solid #aaa; padding-left: 15px; margin-left: 10px; display: flex; gap: 10px;">
                <select id="filter-responsible" onchange="applyFilters()"><option value="">Всі відповідальні</option></select>
                <select id="filter-direction" onchange="applyFilters()"><option value="">Всі напрямки</option></select>
            </div>
        </div>

        <div class="board">
            <div class="column"><div class="column-header">💡 Ідеї</div><div class="task-list" id="col-Ідеї" data-status="Ідеї"></div></div>
            <div class="column"><div class="column-header">📝 Треба зробити</div><div class="task-list" id="col-Треба зробити" data-status="Треба зробити"></div></div>
            <div class="column"><div class="column-header">⚙️ В роботі</div><div class="task-list" id="col-В роботі" data-status="В роботі"></div></div>
            <div class="column"><div class="column-header">👀 На погодження</div><div class="task-list" id="col-На погодження" data-status="На погодження"></div></div>
            <div class="column"><div class="column-header">⚠️ Потребує правок</div><div class="task-list" id="col-Потребує правок" data-status="Потребує правок"></div></div>
            <div class="column"><div class="column-header">✅ Готово</div><div class="task-list" id="col-Готово" data-status="Готово"></div></div>
        </div>
    </div>

    <!-- СТВОРЕННЯ КАРТКИ -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('create-modal')">&times;</span>
            <h3 style="margin-top: 0;">Створити</h3>
            
            <label>Тип картки:</label>
            <select id="new-type" onchange="toggleDeadlineField()">
                <option value="task">📝 Задача (обов'язково виконати)</option>
                <option value="idea">💡 Ідея (на потім)</option>
            </select>

            <label>Назва</label>
            <input type="text" id="new-title" placeholder="Коротко...">
            
            <label>Детальний опис</label>
            <textarea id="new-description" rows="3" placeholder="Опишіть деталі..."></textarea>
            
            <label>Напрямок</label>
            <select id="new-direction"></select>

            <label>Відповідальний</label>
            <select id="new-responsible"></select>

            <div id="deadline-container">
                <label>Дедлайн</label>
                <input type="date" id="new-deadline">
            </div>

            <button style="width: 100%;" onclick="submitTask()">Зберегти</button>
        </div>
    </div>

    <!-- ПЕРЕГЛЯД КАРТКИ -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('task-modal')">&times;</span>
            <h3 id="view-title" style="margin-top: 0;">Назва</h3>
            
            <div style="font-size: 13px; color: #555; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px;">
                <div>Напрямок: <b id="view-direction"></b> | Відповідальний: <b id="view-responsible"></b></div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    Дедлайн: <input type="date" id="view-deadline-input" class="inline-edit-date" onchange="updateTaskDeadline(this.value)">
                    <span id="deadline-save-msg" style="color: green; font-size: 11px; display: none;">✔ Збережено</span>
                </div>
            </div>
            
            <div style="background: #f4f5f7; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                <b style="font-size: 13px;">Опис:</b>
                <div id="view-description" style="font-size: 14px; margin-top: 5px; white-space: pre-wrap;"></div>
            </div>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            
            <h4 style="margin: 0 0 10px 0;">Коментарі</h4>
            <div id="comments-container" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;"></div>
            <textarea id="new-comment" rows="2" placeholder="Написати коментар..."></textarea>
            <button style="width: 100%;" onclick="addComment()">Додати коментар</button>

            <button id="approve-btn" class="btn-success" style="display: none;" onclick="approveTask()">✅ Погодити (Перенести в Готово)</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOTEc7GxwlQJTXehW6zmDbSdFkwBswC9mIGdknwEufNIpeYrAjaSuhXw5rW3Is60ME/exec";
        let currentTasks = [];
        let openedTaskId = null;

        window.onload = () => {
            if (localStorage.getItem("userToken")) showBoard();
        };

        async function appLogin() {
            const user = document.getElementById("login-username").value;
            const pass = document.getElementById("login-password").value;
            const err = document.getElementById("login-error");
            
            err.style.display = "none";
            document.querySelector("#login-screen button").innerText = "Завантаження...";

            try {
                const res = await apiRequest({ action: "login", username: user, password: pass });
                if (res.success) {
                    localStorage.setItem("userToken", res.token);
                    localStorage.setItem("userRole", res.role.toLowerCase());
                    localStorage.setItem("userName", res.username);
                    showBoard();
                } else {
                    err.innerText = res.error; err.style.display = "block";
                    document.querySelector("#login-screen button").innerText = "Увійти";
                }
            } catch (e) { err.innerText = "Помилка."; err.style.display = "block"; }
        }

        function logout() {
            localStorage.clear();
            document.getElementById("board-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }

        function showBoard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("board-screen").style.display = "block";
            document.getElementById("user-info").innerText = `Користувач: ${localStorage.getItem("userName")} (${localStorage.getItem("userRole")})`;
            
            const role = localStorage.getItem("userRole");
            if (role === "manager" || role === "owner") document.getElementById("filters-container").style.display = "flex";

            initSortable();
            loadTasks();
        }

        async function apiRequest(payload) {
            payload.token = localStorage.getItem("userToken");
            const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
            return await response.json();
        }

        async function loadTasks() {
            try {
                let startInput = document.getElementById('date-start');
                let endInput = document.getElementById('date-end');
                
                if (!startInput.value) {
                    const today = new Date().toISOString().split('T')[0];
                    startInput.value = today;
                    endInput.value = today;
                }

                const fetchUrl = `${SCRIPT_URL}?start=${startInput.value}&end=${endInput.value}`;
                
                const res = await fetch(fetchUrl);
                const data = await res.json();
                
                if (data.success) {
                    currentTasks = data.tasks;
                    populateDropdowns(data.users, data.directions); 
                    renderTasks();
                }
            } catch (error) { console.error("Помилка:", error); }
        }

        function populateDropdowns(users, directions) {
            const dirSelect = document.getElementById('new-direction');
            const respSelect = document.getElementById('new-responsible');
            const filterDir = document.getElementById('filter-direction');
            const filterResp = document.getElementById('filter-responsible');
            
            if (dirSelect.options.length > 0) return;

            filterDir.innerHTML = '<option value="">Всі напрямки</option>';
            filterResp.innerHTML = '<option value="">Всі відповідальні</option>';

            if (directions) {
                directions.forEach(d => { dirSelect.innerHTML += `<option value="${d}">${d}</option>`; filterDir.innerHTML += `<option value="${d}">${d}</option>`; });
            }
            if (users) {
                users.forEach(u => { respSelect.innerHTML += `<option value="${u}">${u}</option>`; filterResp.innerHTML += `<option value="${u}">${u}</option>`; });
            }
        }

        function applyFilters() { renderTasks(); }

        function renderTasks() {
            document.querySelectorAll('.task-list').forEach(col => col.innerHTML = '');
            const selectedResp = document.getElementById('filter-responsible').value;
            const selectedDir = document.getElementById('filter-direction').value;

            const today = new Date();
            today.setHours(0,0,0,0);

            currentTasks.forEach(task => {
                if (selectedResp && task.Responsible !== selectedResp) return;
                if (selectedDir && task.Direction !== selectedDir) return;

                const colId = `col-${task.Status}`.trim();
                const column = document.getElementById(colId) || document.getElementById('col-Ідеї');
                
                const card = document.createElement('div');
                card.className = 'task-card';
                card.dataset.id = task.ID;
                card.onclick = () => openTaskModal(task.ID);
                
                let dateHtml = '';

                if (task.Status === 'Ідеї') {
                    dateHtml = `<span style="color: #8993a4;">💡 Ідея</span>`;
                } else if (task.Status === 'Готово') {
                    let closedDate = new Date(task.UpdatedAt).toLocaleDateString('uk-UA');
                    
                    if (task.Deadline) {
                        let dlDate = new Date(task.Deadline).toLocaleDateString('uk-UA');
                        dateHtml = `
                        <div style="display: flex; flex-direction: column; align-items: flex-end; font-size: 11px;">
                            <span style="color: #8993a4;">📅 Дедлайн: ${dlDate}</span>
                            <span style="color: #36b37e; font-weight: bold; margin-top: 2px;">✅ Закрито: ${closedDate}</span>
                        </div>`;
                    } else {
                        dateHtml = `<span style="color: #36b37e; font-weight: bold;">✅ Закрито: ${closedDate}</span>`;
                    }
                } else {
                    if (task.Deadline) {
                        let dlDate = new Date(task.Deadline);
                        let dateStr = dlDate.toLocaleDateString('uk-UA');
                        let isOverdue = dlDate < today;
                        
                        let dateStyle = isOverdue ? 'color: #ff5630; font-weight: bold;' : 'color: #5e6c84;';
                        let warningIcon = isOverdue ? ' ⚠️' : '';
                        
                        dateHtml = `<span style="${dateStyle}">📅 ${dateStr}${warningIcon}</span>`;
                    } else {
                        dateHtml = `<span style="color: #8993a4;">📅 Без дедлайну</span>`;
                    }
                }
                
                // ДОДАНО ВИВЕДЕННЯ НАПРЯМКУ У ВИГЛЯДІ БЕЙДЖИКА
                card.innerHTML = `
                    <div class="task-title">${task.Title}</div>
                    <div style="font-size: 11px; color: #42526e; margin-bottom: 8px; font-weight: 500; background: #dfe1e6; display: inline-block; padding: 2px 6px; border-radius: 3px;">
                        📁 ${task.Direction}
                    </div>
                    <div class="task-meta" style="align-items: flex-end;">
                        <span style="margin-bottom: 2px;">👤 ${task.Responsible}</span>
                        ${dateHtml}
                    </div>
                `;
                column.appendChild(card);
            });
        }

        function initSortable() {
            document.querySelectorAll('.task-list').forEach(col => {
                new Sortable(col, {
                    group: 'kanban', animation: 150,
                    onEnd: async function (evt) {
                        const taskId = evt.item.dataset.id;
                        const newStatus = evt.to.dataset.status;
                        if (newStatus !== evt.from.dataset.status) {
                            const tIndex = currentTasks.findIndex(t => t.ID.toString() === taskId.toString());
                            if(tIndex > -1) currentTasks[tIndex].Status = newStatus;

                            const res = await apiRequest({ action: "updateStatus", taskId: taskId, status: newStatus, isApprovedAction: false });
                            if(!res.success) { alert(res.error); loadTasks(); }
                            else { renderTasks(); }
                        }
                    },
                });
            });
        }

        function toggleDeadlineField() {
            const isIdea = document.getElementById('new-type').value === 'idea';
            document.getElementById('deadline-container').style.display = isIdea ? 'none' : 'block';
        }

        function openCreateModal() { 
            document.getElementById('new-type').value = 'task';
            toggleDeadlineField();
            document.getElementById('create-modal').style.display = 'flex'; 
        }
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitTask() {
            const title = document.getElementById('new-title').value;
            if (!title) return alert("Введіть назву!");
            
            const isIdea = document.getElementById('new-type').value === 'idea';
            
            await apiRequest({
                action: "createTask",
                isIdea: isIdea,
                title: title,
                description: document.getElementById('new-description').value,
                direction: document.getElementById('new-direction').value,
                responsible: document.getElementById('new-responsible').value,
                deadline: isIdea ? "" : document.getElementById('new-deadline').value
            });
            
            closeModal('create-modal');
            document.getElementById('new-title').value = '';
            document.getElementById('new-description').value = '';
            document.getElementById('new-deadline').value = '';
            loadTasks();
        }

        function openTaskModal(id) {
            openedTaskId = id;
            const task = currentTasks.find(t => t.ID.toString() === id.toString());
            
            document.getElementById('view-title').innerText = task.Title;
            document.getElementById('view-description').innerText = task.Description ? task.Description : 'Немає опису';
            document.getElementById('view-direction').innerText = task.Direction;
            document.getElementById('view-responsible').innerText = task.Responsible;
            
            const dateInput = document.getElementById('view-deadline-input');
            if (task.Deadline) {
                dateInput.value = new Date(task.Deadline).toISOString().split('T')[0];
            } else {
                dateInput.value = '';
            }
            document.getElementById('deadline-save-msg').style.display = 'none';
            
            renderComments(task.Comments);
            
            const role = localStorage.getItem("userRole");
            const btn = document.getElementById('approve-btn');
            if ((role === 'manager' || role === 'owner') && task.Status === 'На погодження') {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }

            document.getElementById('task-modal').style.display = 'flex';
        }

        async function updateTaskDeadline(newDate) {
            if (!openedTaskId) return;
            const res = await apiRequest({ action: "updateDeadline", taskId: openedTaskId, deadline: newDate });
            if (res.success) {
                document.getElementById('deadline-save-msg').style.display = 'inline';
                setTimeout(() => { document.getElementById('deadline-save-msg').style.display = 'none'; }, 2000);
                
                const taskIndex = currentTasks.findIndex(t => t.ID.toString() === openedTaskId.toString());
                if (taskIndex > -1) currentTasks[taskIndex].Deadline = newDate;
                renderTasks(); 
            }
        }

        function renderComments(commentsJson) {
            const container = document.getElementById('comments-container');
            container.innerHTML = '';
            let comments = [];
            try { comments = JSON.parse(commentsJson); } catch(e) {}
            
            if (comments.length === 0) { container.innerHTML = '<span style="font-size:12px; color:#999;">Ще немає коментарів.</span>'; return; }
            comments.forEach(c => {
                const dateObj = new Date(c.date);
                const dateStr = dateObj.toLocaleDateString('uk-UA') + ' ' + dateObj.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
                container.innerHTML += `<div class="comment-box"><span class="comment-author">${c.user}</span> <span class="comment-date">${dateStr}</span><div style="margin-top: 4px;">${c.text}</div></div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        async function addComment() {
            const text = document.getElementById('new-comment').value;
            if (!text) return;
            const res = await apiRequest({ action: "addComment", taskId: openedTaskId, text: text });
            if (res.success) {
                document.getElementById('new-comment').value = '';
                const taskIndex = currentTasks.findIndex(t => t.ID.toString() === openedTaskId.toString());
                currentTasks[taskIndex].Comments = JSON.stringify(res.comments);
                renderComments(currentTasks[taskIndex].Comments);
            }
        }

        async function approveTask() {
            const res = await apiRequest({ action: "updateStatus", taskId: openedTaskId, status: "Готово", isApprovedAction: true });
            if (res.success) { closeModal('task-modal'); loadTasks(); } else { alert(res.error); }
        }
    </script>
</body>
</html>
