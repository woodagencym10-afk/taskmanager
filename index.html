<!-- ========================= -->
<!-- FILTERS BLOCK -->
<!-- ЗАМІНИ СВІЙ FILTERS BLOCK -->
<!-- ========================= -->

<div class="filters">

<input
class="filter"
type="text"
id="searchInput"
placeholder="Пошук задач..."
oninput="render()"
/>

<select
class="filter"
id="filterDirection"
onchange="render()"
>
<option value="">
Всі напрямки
</option>
</select>

<select
class="filter"
id="filterAssignee"
onchange="render()"
>
<option value="">
Всі виконавці
</option>
</select>

<input
class="filter"
type="date"
id="dateFrom"
onchange="render()"
/>

<input
class="filter"
type="date"
id="dateTo"
onchange="render()"
/>

<button
class="action-btn"
style="
background:#182133;
"
onclick="setTodayFilter()"
>
Сьогодні
</button>

<button
class="action-btn"
style="
background:#182133;
"
onclick="setWeekFilter()"
>
7 днів
</button>

<button
class="action-btn"
style="
background:#182133;
"
onclick="setMonthFilter()"
>
30 днів
</button>

<button
class="action-btn"
style="
background:#182133;
"
onclick="clearDateFilter()"
>
Весь актив
</button>

</div>

<script>

/* ========================= */
/* DATE FILTERS */
/* ========================= */

function formatDate(date){

    return date
        .toISOString()
        .split("T")[0];

}

function setTodayFilter(){

    const today =
        new Date();

    dateFrom.value =
        formatDate(today);

    dateTo.value =
        formatDate(today);

    render();

}

function setWeekFilter(){

    const today =
        new Date();

    const weekAgo =
        new Date();

    weekAgo.setDate(
        today.getDate() - 7
    );

    dateFrom.value =
        formatDate(weekAgo);

    dateTo.value =
        formatDate(today);

    render();

}

function setMonthFilter(){

    const today =
        new Date();

    const monthAgo =
        new Date();

    monthAgo.setDate(
        today.getDate() - 30
    );

    dateFrom.value =
        formatDate(monthAgo);

    dateTo.value =
        formatDate(today);

    render();

}

function clearDateFilter(){

    dateFrom.value = "";
    dateTo.value = "";

    render();

}

/* ========================= */
/* RENDER SELECTS */
/* ========================= */

function renderSelects(){

    direction.innerHTML =
        `<option value="">Напрямок</option>`;

    assignee.innerHTML =
        `<option value="">Виконавець</option>`;

    filterDirection.innerHTML =
        `<option value="">Всі напрямки</option>`;

    filterAssignee.innerHTML =
        `<option value="">Всі виконавці</option>`;

    editDirection.innerHTML = "";
    editAssignee.innerHTML = "";

    projects.forEach(project=>{

        direction.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

        filterDirection.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

    });

    team.forEach(person=>{

        assignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

        filterAssignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

    });

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(){

    clearColumns();

    let filteredTasks =
        [...tasks];

    const search =
        searchInput.value
        .toLowerCase();

    const directionFilter =
        filterDirection.value;

    const assigneeFilter =
        filterAssignee.value;

    const from =
        dateFrom.value;

    const to =
        dateTo.value;

    filteredTasks =
        filteredTasks.filter(task=>{

            const matchSearch =
                !search ||
                (
                    task["назва"] || ""
                )
                .toLowerCase()
                .includes(search);

            const matchDirection =
                !directionFilter ||
                task["напрямок"] === directionFilter;

            const matchAssignee =
                !assigneeFilter ||
                task["виконавець"] === assigneeFilter;

            let matchDate = true;

            if(from || to){

                const taskDate =
                    task["updatedAt"]
                    ||
                    task["створено"];

                if(taskDate){

                    const date =
                        new Date(taskDate);

                    if(from){

                        matchDate =
                            matchDate &&
                            date >= new Date(from);

                    }

                    if(to){

                        const end =
                            new Date(to);

                        end.setHours(
                            23,59,59
                        );

                        matchDate =
                            matchDate &&
                            date <= end;

                    }

                }

            }

            return (
                matchSearch &&
                matchDirection &&
                matchAssignee &&
                matchDate
            );

        });

    filteredTasks.forEach(task=>{

        const div =
            createTaskCard(task);

        switch(task["статус"]){

            case "В роботі":
                progress.appendChild(div);
                break;

            case "На погодженні":
                review.appendChild(div);
                break;

            case "Потрібні правки":
                revision.appendChild(div);
                break;

            case "Готово":
                done.appendChild(div);
                break;

            default:
                todo.appendChild(div);

        }

    });

    updateCounts();

}

</script>
