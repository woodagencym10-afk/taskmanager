<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетинг / Таск-менеджер</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-body: #0F172A;      
            --bg-col: #1E293B;       
            --bg-card: #334155;      
            --bg-input: #0B1120;     
            --primary: #6366F1;      
            --primary-hover: #4F46E5;
            --text-main: #F8FAFC;    
            --text-sec: #94A3B8;     
            --border-light: #475569; 
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.15);
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -2px rgba(0,0,0,0.2);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; padding: 20px 30px; line-height: 1.5;
        }
        
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748B; }

        /* ВХІД */
        #login-screen { 
            max-width: 320px; margin: 12vh auto; background: var(--bg-col); 
            padding: 40px; border-radius: var(--radius-lg); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
            border: 1px solid var(--border-light);
        }
        #login-screen h2 { margin: 0 0 30px 0; font-size: 24px; font-weight: 700; color: var(--text-main); }
        #login-screen input { 
            width: 100%; padding: 12px 14px; margin-bottom: 15px; border: 1px solid var(--border-light); 
            border-radius: var(--radius-md); box-sizing: border-box; font-family: inherit; font-size: 14px;
            transition: all 0.2s ease; background: var(--bg-input); color: var(--text-main);
        }
        #login-screen input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        
        button { 
            background-color: var(--primary); color: white; border: none; padding: 10px 18px; 
            border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-family: inherit;
            transition: all 0.2s ease; font-size: 14px; display: inline-flex; align-items: center; justify-content: center;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-outline { background-color: transparent; color: var(--text-sec); border: 1px solid var(--border-light); }
        .btn-outline:hover { background-color: var(--bg-card); color: var(--text-main); transform: none; }
        
        #board-screen { display: none; }
        
        /* ШАПКА */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-title { font-size: 24px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px;}
        .user-badge { background: var(--bg-col); border: 1px solid var(--border-light); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--text-sec); }
        
        /* ВІДЖЕТИ АНАЛІТИКИ */
        .stats-container {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--bg-col);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stat-card.alert {
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .stat-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }
        .stat-card.alert .stat-value { color: #F87171; }

        /* ФІЛЬТРИ */
        .filters-bar { 
            display: none; background: var(--bg-col); padding: 12px 20px; border-radius: var(--radius-md); 
            margin-bottom: 25px; align-items: center; gap: 15px; flex-wrap: wrap; 
            border: 1px solid var(--border-light); box-shadow: var(--shadow-card);
        }
        .filters-bar label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .filters-bar select, .filters-bar input[type="date"] { 
            padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); 
            font-family: inherit; font-size: 13px; color: var(--text-main); outline: none; background: var(--bg-input); cursor: pointer;
            color-scheme: dark; 
        }
        .filters-bar select:focus, .filters-bar input[type="date"]:focus { border-color: var(--primary); }
        .filter-divider { width: 1px; height: 24px; background: var(--border-light); margin: 0 5px; }

        /* ДОШКА */
        .board { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; align-items: flex-start; }
        .column { 
            background-color: var(--bg-col); border-radius: var(--radius-md); 
            width: 320px; min-width: 320px; display: flex; flex-direction: column; max-height: calc(100vh - 280px); 
            border: 1px solid var(--border-light); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .column-header { 
            padding: 16px 16px 12px 16px; font-weight: 700; font-size: 14px; color: var(--text-main);
            display: flex; align-items: center; justify-content: space-between;
        }
        .col-count { background: var(--bg-card); color: var(--text-sec); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid var(--border-light);}
        .task-list { padding: 0 12px 12px 12px; flex-grow: 1; overflow-y: auto; min-height: 80px; }
        
        /* КАРТКА */
        .task-card { 
            background-color: var(--bg-card); padding: 16px; border-radius: var(--radius-md); 
            box-shadow: var(--shadow-card); margin-bottom: 10px; cursor: pointer; 
            border: 1px solid var(--border-light); transition: all 0.2s ease; position: relative;
        }
        .task-card:hover { box-shadow: var(--shadow-hover); border-color: #64748B; transform: translateY(-2px); }
        
        .card-direction { 
            font-size: 11px; font-weight: 600; color: #818CF8; background: rgba(99, 102, 241, 0.15); 
            padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px; 
            letter-spacing: 0.3px; border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .task-title { font-weight: 600; margin-bottom: 12px; font-size: 14px; color: var(--text-main); line-height: 1.4; }
        .task-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px dashed var(--border-light); padding-top: 12px;}
        .task-resp { font-size: 12px; font-weight: 500; color: var(--text-sec); display: flex; align-items: center; gap: 6px;}
        .task-resp-avatar { width: 20px; height: 20px; background: var(--border-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-main);}

        /* МОДАЛКИ */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);
            justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal { 
            background: var(--bg-col); padding: 35px; border-radius: var(--radius-lg); 
            width: 550px; max-width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-light);
        }
        .modal label { font-size: 13px; font-weight: 600; color: var(--text-sec); display: block; margin-bottom: 6px; margin-top: 16px; }
        .modal input[type="text"], .modal input[type="date"], .modal select, .modal textarea { 
            width: 100%; padding: 12px 14px; margin-bottom: 5px; border: 1px solid var(--border-light); 
            border-radius: var(--radius-md); box-sizing: border-box; font-family: inherit; font-size: 14px; 
            background: var(--bg-input); color: var(--text-main); color-scheme: dark;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .close-btn { float: right; cursor: pointer; font-size: 24px; color: var(--text-sec); line-height: 1; transition: 0.2s;}
        .close-btn:hover { color: var(--text-main); }
        
        .view-meta-box { background: var(--bg-input); border: 1px solid var(--border-light); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap;}
        .meta-item { display: flex; flex-direction: column; gap: 4px; }
        .meta-label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-sec); letter-spacing: 0.5px;}
        .meta-value { font-size: 14px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 5px;}
        
        .comment-box { background: var(--bg-card); border: 1px solid var(--border-light); padding: 14px; border-radius: var(--radius-md); margin-bottom: 12px; box-shadow: var(--shadow-card);}
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;}
        .comment-author { font-weight: 600; font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 6px;}
        .comment-date { font-size: 11px; color: var(--text-sec); }
        .comment-text { font-size: 14px; color: #E2E8F0; line-height: 1.5;}

        .btn-success { background-color: #10B981; color: #064E3B; margin-top: 25px; width: 100%; padding: 14px; font-size: 15px;}
        .btn-success:hover { background-color: #059669; color: white;}
        .btn-logout { background-color: transparent; color: #F87171; border: 1px solid #F87171; }
        .btn-logout:hover { background-color: #F87171; color: white; }
        
        .inline-edit-date { padding: 4px 8px !important; margin: 0 !important; width: auto !important; display: inline-block; font-size: 13px; border-color: transparent !important; background: transparent !important;}
        .inline-edit-date:hover { background: var(--bg-card) !important; border-color: var(--border-light) !important; }
        
        .sortable-ghost { opacity: 0.3; background-color: var(--bg-input); border: 2px dashed var(--border-light); }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Маркетинг / Задачі</h2>
        <input type="text" id="login-username" placeholder="Ваше ім'я">
        <input type="password" id="login-password" placeholder="Пароль">
        <button style="width: 100%; margin-top: 15px; padding: 14px;" onclick="appLogin()">Увійти в робочий простір</button>
        <p id="login-error" style="color: #F87171; font-size: 13px; display: none; margin-top: 15px; font-weight: 500;"></p>
    </div>

    <div id="board-screen">
        <div class="header">
            <div class="header-title">
                ✨ Маркетинг 
                <span class="user-badge" id="user-info"></span>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button onclick="openCreateModal()">+ Створити картку</button>
                <button class="btn-outline" onclick="logout()">Вийти</button>
            </div>
        </div>

        <!-- ДАШБОРД (ШВИДКИЙ АНАЛІЗ) -->
        <div id="stats-container" class="stats-container">
            <div class="stat-card">
                <div class="stat-title">Заплановано на період</div>
                <div class="stat-value" id="stat-planned">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">В роботі</div>
                <div class="stat-value" id="stat-in-progress">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Виконано</div>
                <div class="stat-value" id="stat-done">0</div>
            </div>
            <div class="stat-card alert">
                <div class="stat-title">Протерміновано</div>
                <div class="stat-value" id="stat-overdue">0</div>
            </div>
        </div>

        <div id="filters-container" class="filters-bar">
            <label>Період аналізу / виконання:</label>
            <input type="date" id="date-start" onchange="loadTasks()">
            <span style="color: var(--text-sec); font-size: 13px;">—</span>
            <input type="date" id="date-end" onchange="loadTasks()">
            
            <div class="filter-divider"></div>
            
            <select id="filter-responsible" onchange="applyFilters()"><option value="">Всі відповідальні</option></select>
            <select id="filter-direction" onchange="applyFilters()"><option value="">Всі напрямки</option></select>
        </div>

        <div class="board">
            <div class="column"><div class="column-header"><span>💡 Ідеї</span><span class="col-count" id="count-Ідеї">0</span></div><div class="task-list" id="col-Ідеї" data-status="Ідеї"></div></div>
            <div class="column"><div class="column-header"><span>📝 Треба зробити</span><span class="col-count" id="count-Треба-зробити">0</span></div><div class="task-list" id="col-Треба зробити" data-status="Треба зробити"></div></div>
            <div class="column"><div class="column-header"><span>⚙️ В роботі</span><span class="col-count" id="count-В-роботі">0</span></div><div class="task-list" id="col-В роботі" data-status="В роботі"></div></div>
            <div class="column"><div class="column-header"><span>👀 На погодження</span><span class="col-count" id="count-На-погодження">0</span></div><div class="task-list" id="col-На погодження" data-status="На погодження"></div></div>
            <div class="column"><div class="column-header"><span>⚠️ Потребує правок</span><span class="col-count" id="count-Потребує-правок">0</span></div><div class="task-list" id="col-Потребує правок" data-status="Потребує правок"></div></div>
            <div class="column"><div class="column-header"><span>✅ Готово</span><span class="col-count" id="count-Готово">0</span></div><div class="task-list" id="col-Готово" data-status="Готово"></div></div>
        </div>
    </div>

    <!-- СТВОРЕННЯ КАРТКИ -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('create-modal')">&times;</span>
            <h3 style="margin-top: 0; font-size: 22px; color: var(--text-main);">Нова картка</h3>
            
            <label>Тип:</label>
            <select id="new-type" onchange="toggleDeadlineField()">
                <option value="task">📝 Задача (обов'язково виконати)</option>
                <option value="idea">💡 Ідея (на потім)</option>
            </select>

            <label>Коротка назва</label>
            <input type="text" id="new-title" placeholder="Що потрібно зробити?">
            
            <label>Детальний опис</label>
            <textarea id="new-description" rows="4" placeholder="ТЗ, посилання, деталі..."></textarea>
            
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Напрямок</label>
                    <select id="new-direction"></select>
                </div>
                <div style="flex: 1;">
                    <label>Відповідальний</label>
                    <select id="new-responsible"></select>
                </div>
            </div>

            <div id="deadline-container">
                <label>Дедлайн</label>
                <input type="date" id="new-deadline">
            </div>

            <button style="width: 100%; margin-top: 25px; padding: 14px;" onclick="submitTask()">Створити картку</button>
        </div>
    </div>

    <!-- ПЕРЕГЛЯД КАРТКИ -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('task-modal')">&times;</span>
            <div class="card-direction" id="view-direction" style="margin-bottom: 15px;"></div>
            <h3 id="view-title" style="margin-top: 0; margin-bottom: 20px; font-size: 22px; color: var(--text-main); line-height: 1.3;"></h3>
            
            <div class="view-meta-box">
                <div class="meta-item">
                    <span class="meta-label">Відповідальний</span>
                    <span class="meta-value" id="view-responsible"></span>
                </div>
                <div class="meta-item" style="flex-grow: 1;">
                    <span class="meta-label">Дедлайн</span>
                    <div style="display: flex; align-items: center;">
                        <input type="date" id="view-deadline-input" class="inline-edit-date" onchange="updateTaskDeadline(this.value)">
                        <span id="deadline-save-msg" style="color: #34D399; font-size: 12px; display: none; font-weight: 600; margin-left: 5px;">✔ Збережено</span>
                    </div>
                </div>
            </div>
            
            <div style="margin-bottom: 30px;">
                <b style="font-size: 14px; color: var(--text-sec);">Опис задачі:</b>
                <div id="view-description" style="font-size: 14px; margin-top: 10px; white-space: pre-wrap; color: var(--text-main); line-height: 1.6;"></div>
            </div>
            
            <hr style="border: 0; border-top: 1px solid var(--border-light); margin: 25px 0;">
            
            <h4 style="margin: 0 0 15px 0; color: var(--text-sec); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Коментарі</h4>
            <div id="comments-container" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px; padding-right: 5px;"></div>
            <textarea id="new-comment" rows="2" placeholder="Написати коментар..."></textarea>
            <button style="margin-top: 10px;" onclick="addComment()">Відправити</button>

            <button id="approve-btn" class="btn-success" style="display: none;" onclick="approveTask()">✅ Погодити (Перенести в Готово)</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOTEc7GxwlQJTXehW6zmDbSdFkwBswC9mIGdknwEufNIpeYrAjaSuhXw5rW3Is60ME/exec";
        let currentTasks = [];
        let openedTaskId = null;

        window.onload = () => {
            if (localStorage.getItem("userToken")) showBoard();
        };

        async function appLogin() {
            const user = document.getElementById("login-username").value;
            const pass = document.getElementById("login-password").value;
            const err = document.getElementById("login-error");
            
            err.style.display = "none";
            document.querySelector("#login-screen button").innerText = "Завантаження...";

            try {
                const res = await apiRequest({ action: "login", username: user, password: pass });
                if (res.success) {
                    localStorage.setItem("userToken", res.token);
                    localStorage.setItem("userRole", res.role.toLowerCase());
                    localStorage.setItem("userName", res.username);
                    showBoard();
                } else {
                    err.innerText = res.error; err.style.display = "block";
                    document.querySelector("#login-screen button").innerText = "Увійти в робочий простір";
                }
            } catch (e) { err.innerText = "Помилка з'єднання."; err.style.display = "block"; }
        }

        function logout() {
            localStorage.clear();
            document.getElementById("board-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("login-username").value = '';
            document.getElementById("login-password").value = '';
        }

        function showBoard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("board-screen").style.display = "block";
            document.getElementById("user-info").innerText = `👤 ${localStorage.getItem("userName")} (${localStorage.getItem("userRole")})`;
            
            document.getElementById("stats-container").style.display = "grid";
            
            const role = localStorage.getItem("userRole");
            if (role === "manager" || role === "owner") document.getElementById("filters-container").style.display = "flex";

            initSortable();
            loadTasks();
        }

        async function apiRequest(payload) {
            payload.token = localStorage.getItem("userToken");
            const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
            return await response.json();
        }

        async function loadTasks() {
            try {
                let startInput = document.getElementById('date-start');
                let endInput = document.getElementById('date-end');
                
                if (!startInput.value) {
                    const today = new Date().toISOString().split('T')[0];
                    startInput.value = today;
                    endInput.value = today;
                }

                const fetchUrl = `${SCRIPT_URL}?start=${startInput.value}&end=${endInput.value}`;
                
                const res = await fetch(fetchUrl);
                const data = await res.json();
                
                if (data.success) {
                    currentTasks = data.tasks;
                    populateDropdowns(data.users, data.directions); 
                    renderTasks();
                }
            } catch (error) { console.error("Помилка:", error); }
        }

        function populateDropdowns(users, directions) {
            const dirSelect = document.getElementById('new-direction');
            const respSelect = document.getElementById('new-responsible');
            const filterDir = document.getElementById('filter-direction');
            const filterResp = document.getElementById('filter-responsible');
            
            if (dirSelect.options.length > 0) return;

            filterDir.innerHTML = '<option value="">Всі напрямки</option>';
            filterResp.innerHTML = '<option value="">Всі відповідальні</option>';

            if (directions) {
                directions.forEach(d => { dirSelect.innerHTML += `<option value="${d}">${d}</option>`; filterDir.innerHTML += `<option value="${d}">${d}</option>`; });
            }
            if (users) {
                users.forEach(u => { respSelect.innerHTML += `<option value="${u}">${u}</option>`; filterResp.innerHTML += `<option value="${u}">${u}</option>`; });
            }
        }

        function applyFilters() { renderTasks(); }

        function renderTasks() {
            document.querySelectorAll('.task-list').forEach(col => col.innerHTML = '');
            const selectedResp = document.getElementById('filter-responsible').value;
            const selectedDir = document.getElementById('filter-direction').value;

            const today = new Date();
            today.setHours(0,0,0,0);
            
            // Дати з фільтру для підрахунку "Заплановано"
            const filterStart = new Date(document.getElementById('date-start').value);
            filterStart.setHours(0,0,0,0);
            const filterEnd = new Date(document.getElementById('date-end').value);
            filterEnd.setHours(23,59,59,999);
            
            let counts = { 'Ідеї': 0, 'Треба зробити': 0, 'В роботі': 0, 'На погодження': 0, 'Потребує правок': 0, 'Готово': 0 };
            let stats = { planned: 0, inProgress: 0, done: 0, overdue: 0 };

            currentTasks.forEach(task => {
                if (selectedResp && task.Responsible !== selectedResp) return;
                if (selectedDir && task.Direction !== selectedDir) return;

                const colId = `col-${task.Status}`.trim();
                const column = document.getElementById(colId) || document.getElementById('col-Ідеї');
                
                counts[task.Status] = (counts[task.Status] || 0) + 1;
                
                let isOverdue = false;
                if (task.Deadline) {
                    let dlDate = new Date(task.Deadline);
                    if (dlDate < today && task.Status !== 'Готово') {
                        isOverdue = true;
                    }
                    
                    // Підрахунок "Заплановано на період"
                    if (task.Status !== 'Готово' && task.Status !== 'Ідеї') {
                        if (dlDate >= filterStart && dlDate <= filterEnd) {
                            stats.planned++;
                        }
                    }
                }
                
                // Інша статистика
                if (task.Status === 'В роботі') stats.inProgress++;
                if (task.Status === 'Готово') stats.done++;
                if (isOverdue) stats.overdue++;
                
                const card = document.createElement('div');
                card.className = 'task-card';
                card.dataset.id = task.ID;
                card.onclick = () => openTaskModal(task.ID);
                
                let dateHtml = '';

                if (task.Status === 'Ідеї') {
                    dateHtml = `<span style="color: var(--text-sec); font-weight: 600;">💡 Ідея</span>`;
                } else if (task.Status === 'Готово') {
                    let closedDate = new Date(task.UpdatedAt).toLocaleDateString('uk-UA');
                    if (task.Deadline) {
                        let dlDate = new Date(task.Deadline).toLocaleDateString('uk-UA');
                        dateHtml = `
                        <div style="display: flex; flex-direction: column; align-items: flex-end; font-size: 11px;">
                            <span style="color: var(--text-sec);">Дедлайн: ${dlDate}</span>
                            <span style="color: #34D399; font-weight: 700; margin-top: 3px;">✅ ${closedDate}</span>
                        </div>`;
                    } else {
                        dateHtml = `<span style="color: #34D399; font-weight: 700;">✅ ${closedDate}</span>`;
                    }
                } else {
                    if (task.Deadline) {
                        let dlDate = new Date(task.Deadline);
                        let dateStr = dlDate.toLocaleDateString('uk-UA', {day: 'numeric', month: 'short'});
                        
                        let dateStyle = isOverdue ? 'color: #F87171; font-weight: 700; background: rgba(239, 68, 68, 0.15); padding: 2px 6px; border-radius: 4px;' : 'color: var(--text-sec); font-weight: 600;';
                        let warningIcon = isOverdue ? ' ⚠️' : '';
                        
                        dateHtml = `<span style="${dateStyle}">${dateStr}${warningIcon}</span>`;
                    } else {
                        dateHtml = `<span style="color: var(--border-light); font-weight: 600;">—</span>`;
                    }
                }
                
                let avatarInitial = task.Responsible ? task.Responsible.charAt(0).toUpperCase() : '?';

                card.innerHTML = `
                    <div class="card-direction">${task.Direction}</div>
                    <div class="task-title">${task.Title}</div>
                    <div class="task-meta">
                        <div class="task-resp">
                            <div class="task-resp-avatar">${avatarInitial}</div>
                            ${task.Responsible}
                        </div>
                        ${dateHtml}
                    </div>
                `;
                column.appendChild(card);
            });
            
            // Оновлення лічильників колонок
            for (let status in counts) {
                let countEl = document.getElementById(`count-${status.replace(/ /g, '-')}`);
                if(countEl) countEl.innerText = counts[status];
            }
            
            // Оновлення дашборду
            document.getElementById('stat-planned').innerText = stats.planned;
            document.getElementById('stat-in-progress').innerText = stats.inProgress;
            document.getElementById('stat-done').innerText = stats.done;
            document.getElementById('stat-overdue').innerText = stats.overdue;
        }

        function initSortable() {
            document.querySelectorAll('.task-list').forEach(col => {
                new Sortable(col, {
                    group: 'kanban', animation: 200, ghostClass: 'sortable-ghost',
                    onEnd: async function (evt) {
                        const taskId = evt.item.dataset.id;
                        const newStatus = evt.to.dataset.status;
                        if (newStatus !== evt.from.dataset.status) {
                            const tIndex = currentTasks.findIndex(t => t.ID.toString() === taskId.toString());
                            if(tIndex > -1) currentTasks[tIndex].Status = newStatus;

                            const res = await apiRequest({ action: "updateStatus", taskId: taskId, status: newStatus, isApprovedAction: false });
                            if(!res.success) { alert(res.error); loadTasks(); }
                            else { renderTasks(); }
                        }
                    },
                });
            });
        }

        function toggleDeadlineField() {
            const isIdea = document.getElementById('new-type').value === 'idea';
            document.getElementById('deadline-container').style.display = isIdea ? 'none' : 'block';
        }

        function openCreateModal() { 
            document.getElementById('new-type').value = 'task';
            toggleDeadlineField();
            document.getElementById('create-modal').style.display = 'flex'; 
        }
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitTask() {
            const title = document.getElementById('new-title').value;
            if (!title) return alert("Введіть назву!");
            
            const isIdea = document.getElementById('new-type').value === 'idea';
            
            await apiRequest({
                action: "createTask",
                isIdea: isIdea,
                title: title,
                description: document.getElementById('new-description').value,
                direction: document.getElementById('new-direction').value,
                responsible: document.getElementById('new-responsible').value,
                deadline: isIdea ? "" : document.getElementById('new-deadline').value
            });
            
            closeModal('create-modal');
            document.getElementById('new-title').value = '';
            document.getElementById('new-description').value = '';
            document.getElementById('new-deadline').value = '';
            loadTasks();
        }

        function openTaskModal(id) {
            openedTaskId = id;
            const task = currentTasks.find(t => t.ID.toString() === id.toString());
            
            document.getElementById('view-title').innerText = task.Title;
            document.getElementById('view-description').innerText = task.Description ? task.Description : 'Немає опису. Додайте деталі, щоб було зрозуміліше.';
            document.getElementById('view-direction').innerText = task.Direction;
            
            let avatarInitial = task.Responsible ? task.Responsible.charAt(0).toUpperCase() : '?';
            document.getElementById('view-responsible').innerHTML = `<div class="task-resp-avatar" style="display:inline-flex; width:24px; height:24px; margin-right:6px;">${avatarInitial}</div>${task.Responsible}`;
            
            const dateInput = document.getElementById('view-deadline-input');
            if (task.Deadline) {
                dateInput.value = new Date(task.Deadline).toISOString().split('T')[0];
            } else {
                dateInput.value = '';
            }
            document.getElementById('deadline-save-msg').style.display = 'none';
            
            renderComments(task.Comments);
            
            const role = localStorage.getItem("userRole");
            const btn = document.getElementById('approve-btn');
            if ((role === 'manager' || role === 'owner') && task.Status === 'На погодження') {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }

            document.getElementById('task-modal').style.display = 'flex';
        }

        async function updateTaskDeadline(newDate) {
            if (!openedTaskId) return;
            const res = await apiRequest({ action: "updateDeadline", taskId: openedTaskId, deadline: newDate });
            if (res.success) {
                document.getElementById('deadline-save-msg').style.display = 'inline';
                setTimeout(() => { document.getElementById('deadline-save-msg').style.display = 'none'; }, 2000);
                
                const taskIndex = currentTasks.findIndex(t => t.ID.toString() === openedTaskId.toString());
                if (taskIndex > -1) currentTasks[taskIndex].Deadline = newDate;
                renderTasks(); 
            }
        }

        function renderComments(commentsJson) {
            const container = document.getElementById('comments-container');
            container.innerHTML = '';
            let comments = [];
            try { comments = JSON.parse(commentsJson); } catch(e) {}
            
            if (comments.length === 0) { container.innerHTML = '<span style="font-size:13px; color:var(--text-sec); font-style: italic;">Коментарів ще немає. Будьте першим!</span>'; return; }
            comments.forEach(c => {
                const dateObj = new Date(c.date);
                const dateStr = dateObj.toLocaleDateString('uk-UA') + ' ' + dateObj.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
                let avatarInitial = c.user ? c.user.charAt(0).toUpperCase() : '?';
                
                container.innerHTML += `
                <div class="comment-box">
                    <div class="comment-header">
                        <span class="comment-author"><div class="task-resp-avatar">${avatarInitial}</div>${c.user}</span>
                        <span class="comment-date">${dateStr}</span>
                    </div>
                    <div class="comment-text">${c.text}</div>
                </div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        async function addComment() {
            const text = document.getElementById('new-comment').value;
            if (!text) return;
            const res = await apiRequest({ action: "addComment", taskId: openedTaskId, text: text });
            if (res.success) {
                document.getElementById('new-comment').value = '';
                const taskIndex = currentTasks.findIndex(t => t.ID.toString() === openedTaskId.toString());
                currentTasks[taskIndex].Comments = JSON.stringify(res.comments);
                renderComments(currentTasks[taskIndex].Comments);
            }
        }

        async function approveTask() {
            const res = await apiRequest({ action: "updateStatus", taskId: openedTaskId, status: "Готово", isApprovedAction: true });
            if (res.success) { closeModal('task-modal'); loadTasks(); } else { alert(res.error); }
        }
    </script>
</body>
</html>
