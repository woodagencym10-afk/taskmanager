<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Marketing OS V6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

:root{

    --bg:#0b1020;
    --sidebar:#111827;
    --card:#182133;
    --card-hover:#1f2b42;
    --border:#283247;
    --text:#f3f5f9;
    --muted:#8b97ad;

    --primary:#5b8cff;
    --success:#22c55e;
    --warning:#f59e0b;
    --danger:#ff5c5c;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);
    color:var(--text);
    font-family:Inter,sans-serif;
    overflow:hidden;

}

.app{

    display:flex;
    height:100vh;

}

.sidebar{

    width:250px;
    background:var(--sidebar);

    border-right:1px solid var(--border);

    padding:28px 18px;

    flex-shrink:0;

}

.logo{

    font-size:28px;
    font-weight:800;

    margin-bottom:40px;

}

.nav{

    display:flex;
    flex-direction:column;
    gap:10px;

}

.nav-item{

    padding:14px 16px;
    border-radius:16px;

    cursor:pointer;

    transition:.2s;

}

.nav-item:hover{

    background:#1c2539;

}

.main{

    flex:1;
    overflow:auto;

    padding:28px;

}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:24px;

    gap:20px;

}

.page-title{

    font-size:34px;
    font-weight:800;

}

.top-actions{

    display:flex;
    gap:12px;

}

.action-btn{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-weight:700;

}

.primary-btn{

    background:var(--primary);

}

.success-btn{

    background:var(--success);

}

.analytics{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:16px;

    margin-bottom:24px;

}

.stat-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

}

.stat-title{

    color:var(--muted);
    font-size:13px;

    margin-bottom:10px;

}

.stat-value{

    font-size:34px;
    font-weight:800;

}

.filters{

    display:flex;
    gap:14px;

    margin-bottom:24px;

    flex-wrap:wrap;

}

.filter{

    width:220px;

}

input,
textarea,
select{

    width:100%;

    background:#101726;

    border:1px solid var(--border);

    border-radius:16px;

    padding:16px;

    color:white;

    outline:none;

}

textarea{

    min-height:120px;
    resize:vertical;

}

.board{

    display:flex;

    gap:20px;

    overflow:auto;

    padding-bottom:20px;

}

.column{

    width:340px;
    min-width:340px;

    background:#121a2b;

    border:1px solid var(--border);

    border-radius:28px;

    padding:18px;

}

.column-header{

    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;

}

.column-count{

    background:#24314a;

    padding:6px 10px;

    border-radius:999px;

    font-size:12px;

}

.task{

    background:var(--card);

    border-radius:22px;

    padding:18px;

    margin-bottom:14px;

    cursor:pointer;

    transition:.2s;

    border:1px solid transparent;

}

.task:hover{

    background:var(--card-hover);

    transform:translateY(-2px);

}

.task.high{

    border-left:5px solid var(--danger);

}

.task.overdue{

    border:1px solid var(--warning);

}

.task-title{

    font-size:18px;
    font-weight:700;

    margin-bottom:12px;

}

.task-direction{

    display:inline-flex;

    background:#24314a;

    padding:8px 12px;

    border-radius:999px;

    font-size:13px;

    margin-bottom:15px;

}

.task-meta{

    display:flex;
    flex-direction:column;

    gap:8px;

    color:#9dacbf;

    font-size:13px;

}

.modal{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:999;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:900px;
    max-width:95%;

    max-height:90vh;

    overflow-y:auto;

    background:#131b2d;

    border-radius:28px;

    padding:30px;

}

.modal-box::-webkit-scrollbar{

    width:8px;

}

.modal-box::-webkit-scrollbar-thumb{

    background:#31405f;
    border-radius:999px;

}

.modal-header{

    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;

}

.close-btn{

    width:42px;
    height:42px;

    border:none;

    border-radius:14px;

    background:#26324a;

    color:white;

    cursor:pointer;

}

.modal-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

    margin-top:20px;

}

.modal-actions{

    display:flex;
    gap:12px;

    margin-top:20px;

    flex-wrap:wrap;

}

.save-btn{

    border:none;

    color:white;

    padding:14px 18px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

}

.comments{

    margin-top:30px;

}

.comment{

    background:#1a2336;

    border-radius:16px;

    padding:14px;

    margin-bottom:10px;

}

.comment-author{

    font-weight:700;

    margin-bottom:6px;

}

@media(max-width:1200px){

    .analytics{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:900px){

    .sidebar{
        display:none;
    }

    .analytics,
    .modal-grid{

        grid-template-columns:1fr;

    }

    .topbar{

        flex-direction:column;
        align-items:flex-start;

    }

}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
🚀 Marketing OS
</div>

<div class="nav">

<div class="nav-item">
📋 Tasks
</div>

<div class="nav-item">
📊 Analytics
</div>

<div class="nav-item">
📚 Knowledge Base
</div>

</div>

</aside>

<div class="main">

<div class="topbar">

<div class="page-title">
Marketing Dashboard
</div>

<div class="top-actions">

<button
class="action-btn primary-btn"
onclick="openCreateModal()"
>
➕ Нова задача
</button>

<button
class="action-btn success-btn"
onclick="openDailyPlanModal()"
>
📋 План на день
</button>

</div>

</div>

<div class="analytics">

<div class="stat-card">
<div class="stat-title">
Всього задач
</div>
<div class="stat-value" id="totalTasks">
0
</div>
</div>

<div class="stat-card">
<div class="stat-title">
В роботі
</div>
<div class="stat-value" id="progressTasks">
0
</div>
</div>

<div class="stat-card">
<div class="stat-title">
На погодженні
</div>
<div class="stat-value" id="reviewTasks">
0
</div>
</div>

<div class="stat-card">
<div class="stat-title">
Прострочені
</div>
<div class="stat-value" id="overdueTasks">
0
</div>
</div>

<div class="stat-card">
<div class="stat-title">
Готово
</div>
<div class="stat-value" id="doneTasks">
0
</div>
</div>

</div>

<div class="filters">

<input
class="filter"
type="text"
id="searchInput"
placeholder="Пошук задач..."
oninput="render()"
/>

<select
class="filter"
id="filterDirection"
onchange="render()"
>
<option value="">
Всі напрямки
</option>
</select>

<select
class="filter"
id="filterAssignee"
onchange="render()"
>
<option value="">
Всі виконавці
</option>
</select>

</div>

<div class="board">

<div class="column">

<div class="column-header">

<h3>
📝 Треба зробити
</h3>

<div class="column-count" id="countTodo">
0
</div>

</div>

<div id="todo"></div>

</div>

<div class="column">

<div class="column-header">

<h3>
⚙️ В роботі
</h3>

<div class="column-count" id="countProgress">
0
</div>

</div>

<div id="progress"></div>

</div>

<div class="column">

<div class="column-header">

<h3>
👀 На погодженні
</h3>

<div class="column-count" id="countReview">
0
</div>

</div>

<div id="review"></div>

</div>

<div class="column">

<div class="column-header">

<h3>
🔁 Потрібні правки
</h3>

<div class="column-count" id="countRevision">
0
</div>

</div>

<div id="revision"></div>

</div>

<div class="column">

<div class="column-header">

<h3>
✅ Готово
</h3>

<div class="column-count" id="countDone">
0
</div>

</div>

<div id="done"></div>

</div>

</div>

</div>

</div>

<!-- CREATE TASK MODAL -->

<div class="modal" id="createTaskModal">

<div class="modal-box">

<div class="modal-header">

<h2>
➕ Нова задача
</h2>

<button
class="close-btn"
onclick="closeCreateModal()"
>
✕
</button>

</div>

<div class="modal-grid">

<div style="grid-column:1/-1;">

<input
type="text"
id="title"
placeholder="Назва задачі"
/>

</div>

<div style="grid-column:1/-1;">

<textarea
id="description"
placeholder="Опис"
></textarea>

</div>

<select id="direction"></select>

<select id="assignee"></select>

<select id="priority">

<option value="Середній">
Середній
</option>

<option value="Високий">
Високий
</option>

</select>

<input type="date" id="deadline"/>

</div>

<button
class="save-btn primary-btn"
style="margin-top:20px;"
onclick="createTask()"
>
Створити задачу
</button>

</div>

</div>

<!-- DAILY PLAN MODAL -->

<div class="modal" id="dailyPlanModal">

<div class="modal-box">

<div class="modal-header">

<h2>
📋 План на день
</h2>

<button
class="close-btn"
onclick="closeDailyPlanModal()"
>
✕
</button>

</div>

<div id="dailyPlanTasks">

Поки пусто

</div>

<div class="modal-actions">

<button
class="save-btn primary-btn"
>
➕ Додати задачу
</button>

<button
class="save-btn success-btn"
>
✅ Підтвердити план
</button>

</div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw3H8TvVhJoENmSts6Msrenivow2rZifFrYlOVcgtE7-SJ8cLEdx9sBGQQHY5YT8AKo/exec";

let tasks = [];
let comments = [];
let projects = [];
let team = [];

const statuses = {

    todo:"Треба зробити",
    progress:"В роботі",
    review:"На погодженні",
    revision:"Потрібні правки",
    done:"Готово"

};

async function loadData(){

    const res = await fetch(
        API_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    tasks = data.tasks || [];
    comments = data.comments || [];
    projects = data.projects || [];
    team = data.team || [];

    render();
    renderAnalytics();
    renderSelects();

}

function renderSelects(){

    direction.innerHTML =
        `<option value="">Напрямок</option>`;

    assignee.innerHTML =
        `<option value="">Виконавець</option>`;

    filterDirection.innerHTML =
        `<option value="">Всі напрямки</option>`;

    filterAssignee.innerHTML =
        `<option value="">Всі виконавці</option>`;

    projects.forEach(project=>{

        direction.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

        filterDirection.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

    });

    team.forEach(person=>{

        assignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

        filterAssignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

    });

}

function renderAnalytics(){

    totalTasks.textContent =
        tasks.length;

    progressTasks.textContent =
        tasks.filter(
            t=>t["статус"] === "В роботі"
        ).length;

    reviewTasks.textContent =
        tasks.filter(
            t=>t["статус"] === "На погодженні"
        ).length;

    doneTasks.textContent =
        tasks.filter(
            t=>t["статус"] === "Готово"
        ).length;

    overdueTasks.textContent =
        tasks.filter(isOverdue).length;

}

function isOverdue(task){

    if(
        !task["дедлайн"] ||
        task["статус"] === "Готово"
    ){
        return false;
    }

    return new Date(task["дедлайн"])
        < new Date();

}

function render(){

    clearColumns();

    let filteredTasks = [...tasks];

    const search =
        searchInput.value.toLowerCase();

    const directionFilter =
        filterDirection.value;

    const assigneeFilter =
        filterAssignee.value;

    filteredTasks =
        filteredTasks.filter(task=>{

            const matchSearch =
                !search ||
                (task["назва"] || "")
                .toLowerCase()
                .includes(search);

            const matchDirection =
                !directionFilter ||
                task["напрямок"] === directionFilter;

            const matchAssignee =
                !assigneeFilter ||
                task["виконавець"] === assigneeFilter;

            return (
                matchSearch &&
                matchDirection &&
                matchAssignee
            );

        });

    filteredTasks.forEach(task=>{

        const div =
            createTaskCard(task);

        switch(task["статус"]){

            case "В роботі":
                progress.appendChild(div);
                break;

            case "На погодженні":
                review.appendChild(div);
                break;

            case "Потрібні правки":
                revision.appendChild(div);
                break;

            case "Готово":
                done.appendChild(div);
                break;

            default:
                todo.appendChild(div);

        }

    });

    updateCounts();

}

function updateCounts(){

    countTodo.textContent =
        todo.children.length;

    countProgress.textContent =
        progress.children.length;

    countReview.textContent =
        review.children.length;

    countRevision.textContent =
        revision.children.length;

    countDone.textContent =
        done.children.length;

}

function createTaskCard(task){

    const div =
        document.createElement("div");

    div.className =
        `task
        ${
            task["пріоритет"] === "Високий"
            ? "high"
            : ""
        }
        ${
            isOverdue(task)
            ? "overdue"
            : ""
        }`;

    div.dataset.id = task.id;

    div.innerHTML = `

        <div class="task-title">
            ${task["назва"]}
        </div>

        <div class="task-direction">
            📁 ${task["напрямок"] || "—"}
        </div>

        <div class="task-meta">

            <div>
                👤 ${task["виконавець"] || "—"}
            </div>

            <div>
                ⏰ ${task["дедлайн"] || "—"}
            </div>

        </div>

    `;

    return div;

}

async function createTask(){

    const newTask = {

        id:Date.now().toString(),

        "назва":title.value,
        "опис":description.value,
        "статус":"Треба зробити",
        "пріоритет":priority.value,
        "виконавець":assignee.value,
        "дедлайн":deadline.value,
        "напрямок":direction.value

    };

    tasks.unshift(newTask);

    render();
    renderAnalytics();

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"createTask",

            "назва":title.value,
            "опис":description.value,
            "напрямок":direction.value,
            "виконавець":assignee.value,
            "пріоритет":priority.value,
            "дедлайн":deadline.value

        })
    });

    closeCreateModal();

}

function openCreateModal(){

    createTaskModal
        .classList
        .add("show");

}

function closeCreateModal(){

    createTaskModal
        .classList
        .remove("show");

}

function openDailyPlanModal(){

    dailyPlanModal
        .classList
        .add("show");

}

function closeDailyPlanModal(){

    dailyPlanModal
        .classList
        .remove("show");

}

function clearColumns(){

    todo.innerHTML = "";
    progress.innerHTML = "";
    review.innerHTML = "";
    revision.innerHTML = "";
    done.innerHTML = "";

}

[
    "todo",
    "progress",
    "review",
    "revision",
    "done"
].forEach(id=>{

    new Sortable(
        document.getElementById(id),
        {

            group:"tasks",

            animation:150,

            onEnd: async(evt)=>{

                const taskId =
                    evt.item.dataset.id;

                const newStatus =
                    statuses[evt.to.id];

                const task =
                    tasks.find(
                        t=>t.id == taskId
                    );

                if(task){

                    task["статус"] =
                        newStatus;

                }

                render();
                renderAnalytics();

                await fetch(API_URL,{
                    method:"POST",
                    body:JSON.stringify({

                        action:"updateTaskStatus",

                        id:taskId,

                        newStatus:newStatus

                    })
                });

            }

        }
    );

});

loadData();

</script>

</body>
</html>
