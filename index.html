<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетинг Таск-Менеджер</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --col-bg: #ebecf0;
            --card-bg: #ffffff;
            --primary: #0052cc;
            --text: #172b4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        /* ЕКРАН ВХОДУ */
        #login-screen {
            max-width: 300px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        #login-screen input, #login-screen select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0043a6; }
        
        /* КАНБАН ДОШКА */
        #board-screen { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .board {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .column {
            background-color: var(--col-bg);
            border-radius: 8px;
            width: 280px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }
        .column-header {
            padding: 10px 15px;
            font-weight: bold;
            border-bottom: 2px solid #dfe1e6;
        }
        .task-list {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 50px;
        }
        .task-card {
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 4px solid var(--primary);
        }
        .task-card:hover { background-color: #f9fafc; }
        .task-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .task-meta { font-size: 12px; color: #5e6c84; display: flex; justify-content: space-between;}

        /* МОДАЛЬНІ ВІКНА */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 8px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .close-btn { float: right; cursor: pointer; font-size: 20px; font-weight: bold; }
        
        /* Коментарі */
        .comment-box { background: #f4f5f7; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 13px;}
        .comment-author { font-weight: bold; color: var(--primary); }
        .comment-date { font-size: 10px; color: #777; margin-left: 5px; }

        .btn-success { background-color: #36b37e; margin-top: 15px;}
        .btn-success:hover { background-color: #2b9065; }
        .btn-logout { background-color: #ff5630; width: auto; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Вхід в систему</h2>
        <input type="text" id="login-username" placeholder="Ваше ім'я (напр. Марія)">
        <input type="password" id="login-password" placeholder="Пароль">
        <button onclick="appLogin()">Увійти</button>
        <p id="login-error" style="color: red; font-size: 12px; display: none;"></p>
    </div>

    <div id="board-screen">
        <div class="header">
            <div>
                <h2>Маркетинг / Задачі</h2>
                <span id="user-info" style="color: #5e6c84; font-size: 14px;"></span>
            </div>
            <div>
                <button onclick="openCreateModal()" style="width: auto; margin-right: 10px;">+ Нова задача</button>
                <button class="btn-logout" onclick="logout()">Вийти</button>
            </div>
        </div>

        <div class="board">
            <div class="column">
                <div class="column-header">💡 Ідеї</div>
                <div class="task-list" id="col-Ідеї" data-status="Ідеї"></div>
            </div>
            <div class="column">
                <div class="column-header">📝 Треба зробити</div>
                <div class="task-list" id="col-Треба зробити" data-status="Треба зробити"></div>
            </div>
            <div class="column">
                <div class="column-header">⚙️ В роботі</div>
                <div class="task-list" id="col-В роботі" data-status="В роботі"></div>
            </div>
            <div class="column">
                <div class="column-header">👀 На погодження</div>
                <div class="task-list" id="col-На погодження" data-status="На погодження"></div>
            </div>
            <div class="column">
                <div class="column-header">⚠️ Потребує правок</div>
                <div class="task-list" id="col-Потребує правок" data-status="Потребує правок"></div>
            </div>
            <div class="column">
                <div class="column-header">✅ Готово</div>
                <div class="task-list" id="col-Готово" data-status="Готово"></div>
            </div>
        </div>
    </div>

    <div id="create-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('create-modal')">&times;</span>
            <h3>Додати задачу</h3>
            <label>Що треба зробити?</label>
            <input type="text" id="new-title" placeholder="Назва задачі">
            
            <label>Напрямок (Сторінка)</label>
            <select id="new-direction">
                </select>

            <label>Відповідальний</label>
            <select id="new-responsible">
                </select>

            <label>Дедлайн</label>
            <input type="date" id="new-deadline">

            <button onclick="submitTask()">Створити</button>
        </div>
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal('task-modal')">&times;</span>
            <h3 id="view-title">Назва</h3>
            <p style="font-size: 13px; color: #555;">
                Напрямок: <b id="view-direction"></b><br>
                Відповідальний: <b id="view-responsible"></b><br>
                Дедлайн: <b id="view-deadline"></b>
            </p>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            
            <h4>Коментарі</h4>
            <div id="comments-container" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;"></div>
            
            <textarea id="new-comment" rows="2" placeholder="Написати коментар..."></textarea>
            <button onclick="addComment()">Додати коментар</button>

            <button id="approve-btn" class="btn-success" style="display: none;" onclick="approveTask()">✅ Погодити (Перенести в Готово)</button>
        </div>
    </div>

    <script>
        // ТВОЄ НОВЕ ПОСИЛАННЯ НА БЕКЕНД
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOTEc7GxwlQJTXehW6zmDbSdFkwBswC9mIGdknwEufNIpeYrAjaSuhXw5rW3Is60ME/exec";
        
        let currentTasks = [];
        let openedTaskId = null;

        // Ініціалізація при завантаженні
        window.onload = () => {
            const token = localStorage.getItem("userToken");
            if (token) {
                showBoard();
            }
        };

        // --- ЛОГІКА АВТОРИЗАЦІЇ ---
        async function appLogin() {
            const user = document.getElementById("login-username").value;
            const pass = document.getElementById("login-password").value;
            const err = document.getElementById("login-error");
            
            err.style.display = "none";
            const btn = document.querySelector("#login-screen button");
            btn.innerText = "Завантаження...";

            try {
                const res = await apiRequest({ action: "login", username: user, password: pass });
                if (res.success) {
                    localStorage.setItem("userToken", res.token);
                    localStorage.setItem("userRole", res.role);
                    localStorage.setItem("userName", res.username);
                    showBoard();
                } else {
                    err.innerText = res.error;
                    err.style.display = "block";
                }
            } catch (e) {
                err.innerText = "Помилка з'єднання.";
                err.style.display = "block";
            }
            btn.innerText = "Увійти";
        }

        function logout() {
            localStorage.clear();
            document.getElementById("board-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("login-username").value = "";
            document.getElementById("login-password").value = "";
        }

        function showBoard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("board-screen").style.display = "block";
            document.getElementById("user-info").innerText = `Користувач: ${localStorage.getItem("userName")} (${localStorage.getItem("userRole")})`;
            initSortable();
            loadTasks();
        }

        // --- РОБОТА З API ---
        async function apiRequest(payload) {
            payload.token = localStorage.getItem("userToken");
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        async function loadTasks() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                if (data.success) {
                    currentTasks = data.tasks;
                    renderTasks();
                    populateDropdowns(data.users, data.directions); 
                }
            } catch (error) {
                console.error("Помилка завантаження даних:", error);
            }
        }

        // --- ДИНАМІЧНІ СПИСКИ (Нова функція) ---
        function populateDropdowns(users, directions) {
            const dirSelect = document.getElementById('new-direction');
            const respSelect = document.getElementById('new-responsible');
            
            dirSelect.innerHTML = '';
            respSelect.innerHTML = '';

            if (directions && directions.length > 0) {
                directions.forEach(d => {
                    dirSelect.innerHTML += `<option value="${d}">${d}</option>`;
                });
            } else {
                dirSelect.innerHTML = '<option value="">Немає напрямків у таблиці</option>';
            }

            if (users && users.length > 0) {
                users.forEach(u => {
                    respSelect.innerHTML += `<option value="${u}">${u}</option>`;
                });
            } else {
                respSelect.innerHTML = '<option value="">Немає користувачів у таблиці</option>';
            }
        }

        // --- ВІДОБРАЖЕННЯ ТА DRAG & DROP ---
        function renderTasks() {
            document.querySelectorAll('.task-list').forEach(col => col.innerHTML = '');
            
            currentTasks.forEach(task => {
                const colId = `col-${task.Status}`.trim();
                const column = document.getElementById(colId) || document.getElementById('col-Ідеї');
                
                const card = document.createElement('div');
                card.className = 'task-card';
                card.dataset.id = task.ID;
                card.onclick = () => openTaskModal(task.ID);
                
                let dateDisplay = task.Deadline ? new Date(task.Deadline).toLocaleDateString('uk-UA') : 'Немає';
                
                card.innerHTML = `
                    <div class="task-title">${task.Title}</div>
                    <div class="task-meta">
                        <span>👤 ${task.Responsible}</span>
                        <span>📅 ${dateDisplay}</span>
                    </div>
                `;
                column.appendChild(card);
            });
        }

        function initSortable() {
            const columns = document.querySelectorAll('.task-list');
            columns.forEach(col => {
                new Sortable(col, {
                    group: 'kanban',
                    animation: 150,
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const taskId = itemEl.dataset.id;
                        const newStatus = evt.to.dataset.status;
                        const oldStatus = evt.from.dataset.status;

                        if (newStatus !== oldStatus) {
                            const res = await apiRequest({
                                action: "updateStatus",
                                taskId: taskId,
                                status: newStatus,
                                isApprovedAction: false
                            });
                            
                            if(!res.success) {
                                alert(res.error);
                                loadTasks(); // Відкочуємо UI при помилці
                            }
                        }
                    },
                });
            });
        }

        // --- СТВОРЕННЯ ЗАДАЧІ ---
        function openCreateModal() { document.getElementById('create-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitTask() {
            const title = document.getElementById('new-title').value;
            if (!title) return alert("Введіть назву!");
            
            await apiRequest({
                action: "createTask",
                title: title,
                direction: document.getElementById('new-direction').value,
                responsible: document.getElementById('new-responsible').value,
                deadline: document.getElementById('new-deadline').value
            });
            
            closeModal('create-modal');
            document.getElementById('new-title').value = '';
            loadTasks();
        }

        // --- ПЕРЕГЛЯД ЗАДАЧІ, КОМЕНТАРІ ТА ПОГОДЖЕННЯ ---
        function openTaskModal(id) {
            openedTaskId = id;
            const task = currentTasks.find(t => t.ID.toString() === id.toString());
            
            document.getElementById('view-title').innerText = task.Title;
            document.getElementById('view-direction').innerText = task.Direction;
            document.getElementById('view-responsible').innerText = task.Responsible;
            document.getElementById('view-deadline').innerText = task.Deadline ? new Date(task.Deadline).toLocaleDateString('uk-UA') : 'Не встановлено';
            
            renderComments(task.Comments);
            
            const role = localStorage.getItem("userRole");
            const btn = document.getElementById('approve-btn');
            if (role === 'manager' && task.Status === 'На погодження') {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }

            document.getElementById('task-modal').style.display = 'flex';
        }

        function renderComments(commentsJson) {
            const container = document.getElementById('comments-container');
            container.innerHTML = '';
            let comments = [];
            try { comments = JSON.parse(commentsJson); } catch(e) {}
            
            if (comments.length === 0) {
                container.innerHTML = '<span style="font-size:12px; color:#999;">Ще немає коментарів.</span>';
                return;
            }

            comments.forEach(c => {
                const dateObj = new Date(c.date);
                const dateStr = dateObj.toLocaleDateString('uk-UA') + ' ' + dateObj.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
                container.innerHTML += `
                    <div class="comment-box">
                        <span class="comment-author">${c.user}</span> <span class="comment-date">${dateStr}</span>
                        <div style="margin-top: 4px;">${c.text}</div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        async function addComment() {
            const text = document.getElementById('new-comment').value;
            if (!text) return;

            const res = await apiRequest({
                action: "addComment",
                taskId: openedTaskId,
                text: text
            });

            if (res.success) {
                document.getElementById('new-comment').value = '';
                const taskIndex = currentTasks.findIndex(t => t.ID.toString() === openedTaskId.toString());
                currentTasks[taskIndex].Comments = JSON.stringify(res.comments);
                renderComments(currentTasks[taskIndex].Comments);
            }
        }

        async function approveTask() {
            const res = await apiRequest({
                action: "updateStatus",
                taskId: openedTaskId,
                status: "Готово",
                isApprovedAction: true
            });

            if (res.success) {
                closeModal('task-modal');
                loadTasks();
            } else {
                alert(res.error);
            }
        }
    </script>
</body>
</html>
