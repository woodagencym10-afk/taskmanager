<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw3H8TvVhJoENmSts6Msrenivow2rZifFrYlOVcgtE7-SJ8cLEdx9sBGQQHY5YT8AKo/exec";

let tasks = [];
let projects = [];
let team = [];
let activity = [];

const statuses = {
    todo:"Треба зробити",
    progress:"В роботі",
    review:"На погодженні",
    revision:"Потрібні правки",
    done:"Готово"
};

async function loadData(){

    const res = await fetch(
        API_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    tasks = data.tasks || [];
    projects = data.projects || [];
    team = data.team || [];
    activity = data.activity || [];

    render();

}

function render(){

    renderBoard();
    renderStats();
    renderActivity();
    renderFilters();
    renderSelects();

}

function renderSelects(){

    const direction =
        document.getElementById("taskDirection");

    const assignee =
        document.getElementById("taskAssignee");

    direction.innerHTML =
        `<option value="">Напрямок</option>`;

    assignee.innerHTML =
        `<option value="">Виконавець</option>`;

    projects.forEach(project=>{

        direction.innerHTML += `
            <option value="${project.name}">
                ${project.name}
            </option>
        `;

    });

    team.forEach(person=>{

        assignee.innerHTML += `
            <option value="${person.name}">
                ${person.name}
            </option>
        `;

    });

}

function renderFilters(){

    const filters =
        document.getElementById("filters");

    filters.innerHTML = "";

    projects.forEach(project=>{

        filters.innerHTML += `
            <button class="filter-btn">
                ${project.name}
            </button>
        `;

    });

}

function renderBoard(){

    clearColumns();

    tasks.forEach(task=>{

        const card =
            createTaskCard(task);

        switch(task["статус"]){

            case "В роботі":

                document
                    .getElementById("progress")
                    .appendChild(card);

                break;

            case "На погодженні":

                document
                    .getElementById("review")
                    .appendChild(card);

                break;

            case "Потрібні правки":

                document
                    .getElementById("revision")
                    .appendChild(card);

                break;

            case "Готово":

                document
                    .getElementById("done")
                    .appendChild(card);

                break;

            default:

                document
                    .getElementById("todo")
                    .appendChild(card);

        }

    });

    updateCounts();

}

function createTaskCard(task){

    const div =
        document.createElement("div");

    div.className =
        `task ${
            task["пріоритет"] === "Високий"
            ? "high"
            : ""
        }`;

    div.dataset.id = task.id;

    div.innerHTML = `

        <div class="task-title">
            ${task["назва"]}
        </div>

        <div class="direction">
            📁 ${task["напрямок"] || "—"}
        </div>

        <div class="task-meta">

            <div>
                👤 ${task["виконавець"] || "—"}
            </div>

            <div>
                🔥 ${task["пріоритет"] || "—"}
            </div>

            <div>
                ⏰ ${task["дедлайн"] || "—"}
            </div>

        </div>

    `;

    return div;

}

function clearColumns(){

    [
        "todo",
        "progress",
        "review",
        "revision",
        "done"
    ].forEach(id=>{

        document
            .getElementById(id)
            .innerHTML = "";

    });

}

function updateCounts(){

    document.getElementById("count-todo")
        .textContent =
        document.getElementById("todo")
        .children.length;

    document.getElementById("count-progress")
        .textContent =
        document.getElementById("progress")
        .children.length;

    document.getElementById("count-review")
        .textContent =
        document.getElementById("review")
        .children.length;

    document.getElementById("count-revision")
        .textContent =
        document.getElementById("revision")
        .children.length;

    document.getElementById("count-done")
        .textContent =
        document.getElementById("done")
        .children.length;

}

function renderStats(){

    document.getElementById("totalTasks")
        .textContent =
        tasks.length;

    document.getElementById("reviewTasks")
        .textContent =
        tasks.filter(
            t=>t["статус"] === "На погодженні"
        ).length;

    document.getElementById("doneTasks")
        .textContent =
        tasks.filter(
            t=>t["статус"] === "Готово"
        ).length;

}

function renderActivity(){

    const container =
        document.getElementById("activityList");

    container.innerHTML = "";

    activity
        .slice(-10)
        .reverse()
        .forEach(item=>{

            container.innerHTML += `
                <div class="activity-item">
                    ⚡ ${item.action}
                </div>
            `;

        });

}

async function changeStatus(id,newStatus){

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"updateTaskStatus",
            id:id,
            newStatus:newStatus
        })
    });

    await loadData();

    showToast("Статус оновлено");

}

document
.getElementById("taskForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({

            action:"createTask",

            "назва":
                document
                .getElementById("taskTitle")
                .value,

            "опис":
                document
                .getElementById("taskDescription")
                .value,

            "напрямок":
                document
                .getElementById("taskDirection")
                .value,

            "виконавець":
                document
                .getElementById("taskAssignee")
                .value,

            "пріоритет":
                document
                .getElementById("taskPriority")
                .value,

            "дедлайн":
                document
                .getElementById("taskDeadline")
                .value

        })
    });

    e.target.reset();

    await loadData();

    showToast("Задачу створено");

});

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2500);

}

[
    "todo",
    "progress",
    "review",
    "revision",
    "done"
].forEach(id=>{

    new Sortable(
        document.getElementById(id),
        {

            group:"tasks",

            animation:180,

            onEnd: async(evt)=>{

                const taskId =
                    evt.item.dataset.id;

                const newStatus =
                    statuses[evt.to.id];

                await changeStatus(
                    taskId,
                    newStatus
                );

            }

        }
    );

});

loadData();

</script>
